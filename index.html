<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeFlow // Minimalist Speed Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #111113;
            --card-bg: #18181b;
            --text-color: #71717a;
            --text-active: #f4f4f5;
            --accent-color: #f59e0b;
            --error-color: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-active);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .modes-bar {
            display: flex;
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 8px;
            gap: 12px;
            font-size: 14px;
        }

        .mode-group {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: color 0.2s;
        }

        .mode-btn:hover, .mode-btn.active {
            color: var(--accent-color);
        }

        .divider {
            color: #3f3f46;
        }

        main {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .live-stats {
            display: flex;
            gap: 20px;
            font-size: 20px;
            color: var(--accent-color);
            height: 30px;
        }

        .typing-container {
            position: relative;
            font-size: 24px;
            line-height: 2.2;
            height: 130px;
            overflow: hidden;
            user-select: none;
            outline: none;
        }

        /* Word and character layout wrapper */
        .word {
            display: inline-block;
            margin-right: 12px;
            white-space: nowrap;
        }

        .letter {
            position: relative;
            transition: color 0.1s ease;
        }

        .letter.correct {
            color: var(--text-active);
        }

        .letter.incorrect {
            color: var(--error-color);
            background-color: var(--error-bg);
            border-radius: 2px;
        }

        /* Blinking cursor simulation */
        .letter.current-cursor::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            height: 70%;
            width: 2px;
            background-color: var(--accent-color);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .restart-prompt {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: none;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            background: #27272a;
            color: var(--text-active);
        }

        /* Results Screen View */
        .results-card {
            display: none;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .results-card.active {
            display: block;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .result-box .label {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-box .value {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-active);
        }

        .result-box.highlight .value {
            color: var(--accent-color);
        }

        footer {
            font-size: 13px;
            color: #52525b;
        }

        footer kbd {
            background: var(--card-bg);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #3f3f46;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Type<span>Flow</span></div>
        <div class="modes-bar">
            <div class="mode-group" id="time-modes">
                <button class="mode-btn" data-time="15">15</button>
                <button class="mode-btn active" data-time="30">30</button>
                <button class="mode-btn" data-time="60">60</button>
            </div>
            <span class="divider">/</span>
            <div class="mode-group" id="word-modes">
                <button class="mode-btn" data-words="10">10w</button>
                <button class="mode-btn" data-words="25">25w</button>
            </div>
        </div>
    </header>

    <main>
        <div id="game-section">
            <div class="live-stats">
                <div id="timer-display">30</div>
            </div>
            <!-- tabindex makes the custom container naturally focusable via JS -->
            <div class="typing-container" id="typing-container" tabindex="0">
                <div id="words-wrapper"></div>
            </div>
            <div class="restart-prompt">
                <button class="icon-btn" onclick="initGame()">
                    ↻ Reset <kbd>Tab</kbd>
                </button>
            </div>
        </div>

        <div class="results-card" id="results-card">
            <h2>Test Complete</h2>
            <div class="results-grid">
                <div class="result-box highlight">
                    <div class="label">wpm</div>
                    <div class="value" id="res-wpm">0</div>
                </div>
                <div class="result-box">
                    <div class="label">acc</div>
                    <div class="value" id="res-acc">0%</div>
                </div>
                <div class="result-box">
                    <div class="label">characters</div>
                    <div class="value" id="res-chars">0/0</div>
                </div>
            </div>
            <button class="icon-btn" style="margin: 0 auto;" onclick="initGame()">Next Test ↻</button>
        </div>
    </main>

    <footer>
        Press <kbd>Tab</kbd> + <kbd>Enter</kbd> or click reset to restart anytime.
    </footer>

    <script>
        const wordPool = [
            "the", "be", "to", "of", "and", "a", "in", "that", "have", "i", 
            "it", "for", "not", "on", "with", "he", "as", "you", "do", "at", 
            "this", "but", "his", "by", "from", "they", "we", "say", "her", "she", 
            "or", "an", "will", "my", "one", "all", "would", "there", "their", "what",
            "code", "script", "function", "variable", "browser", "frontend", "backend",
            "developer", "syntax", "framework", "network", "system", "algorithm", "database"
        ];

        let testMode = 'time'; // 'time' or 'words'
        let modeLimit = 30;   // 30 seconds or 25 words default
        
        let timer = null;
        let timeLeft = 30;
        let isStarted = false;
        let isFinished = false;
        
        let wordsList = [];
        let cursorIndex = 0;
        let correctCharsCount = 0;
        let incorrectCharsCount = 0;
        let totalTypedCount = 0;

        const typingContainer = document.getElementById('typing-container');
        const wordsWrapper = document.getElementById('words-wrapper');
        const timerDisplay = document.getElementById('timer-display');
        const gameSection = document.getElementById('game-section');
        const resultsCard = document.getElementById('results-card');

        // Mode Switching Setup
        document.querySelectorAll('.modes-bar button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.modes-bar button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                if(e.target.dataset.time) {
                    testMode = 'time';
                    modeLimit = parseInt(e.target.dataset.time);
                } else if(e.target.dataset.words) {
                    testMode = 'words';
                    modeLimit = parseInt(e.target.dataset.words);
                }
                initGame();
            });
        });

        function initGame() {
            clearInterval(timer);
            isStarted = false;
            isFinished = false;
            cursorIndex = 0;
            correctCharsCount = 0;
            incorrectCharsCount = 0;
            totalTypedCount = 0;
            timeLeft = modeLimit;

            timerDisplay.textContent = testMode === 'time' ? timeLeft : `-`;
            gameSection.style.display = 'block';
            resultsCard.classList.remove('active');

            generateWords();
            typingContainer.focus();
        }

        function generateWords() {
            wordsList = [];
            let targetCount = testMode === 'time' ? 60 : modeLimit;
            for(let i = 0; i < targetCount; i++) {
                let randomWord = wordPool[Math.floor(Math.random() * wordPool.length)];
                wordsList.push(randomWord);
            }

            renderWords();
        }

        function renderWords() {
            wordsWrapper.innerHTML = '';
            wordsList.forEach((word, wIdx) => {
                let wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                
                for(let cIdx = 0; cIdx < word.length; cIdx++) {
                    let letterSpan = document.createElement('span');
                    letterSpan.className = 'letter';
                    letterSpan.textContent = word[cIdx];
                    wordSpan.appendChild(letterSpan);
                }
                // Add a space element marker concept between words
                if(wIdx < wordsList.length - 1) {
                    let spaceSpan = document.createElement('span');
                    spaceSpan.className = 'letter';
                    spaceSpan.textContent = ' ';
                    wordSpan.appendChild(spaceSpan);
                }
                wordsWrapper.appendChild(wordSpan);
            });

            updateCursorPosition();
        }

        function updateCursorPosition() {
            const allLetters = wordsWrapper.querySelectorAll('.letter');
            allLetters.forEach((l, idx) => {
                l.classList.remove('current-cursor');
                if(idx === cursorIndex) {
                    l.classList.add('current-cursor');
                }
            });
        }

        typingContainer.addEventListener('keydown', (e) => {
            if(isFinished) return;

            // Prevent default page jumps on spacebar
            if(e.key === ' ' || e.key === 'Tab') {
                e.preventDefault();
            }

            if(e.key === 'Tab') {
                initGame();
                return;
            }

            const allLetters = wordsWrapper.querySelectorAll('.letter');

            // Handle Backspace
            if(e.key === 'Backspace') {
                if(cursorIndex > 0) {
                    cursorIndex--;
                    allLetters[cursorIndex].classList.remove('correct', 'incorrect');
                    updateCursorPosition();
                }
                return;
            }

            // Capture valid printable character entries only
            if(e.key.length === 1) {
                if(!isStarted) {
                    isStarted = true;
                    if(testMode === 'time') {
                        timer = setInterval(countDownTimer, 1000);
                    }
                }

                if(cursorIndex < allLetters.length) {
                    totalTypedCount++;
                    let expectedChar = allLetters[cursorIndex].textContent;
                    
                    if(e.key === expectedChar) {
                        allLetters[cursorIndex].classList.add('correct');
                        correctCharsCount++;
                    } else {
                        allLetters[cursorIndex].classList.add('incorrect');
                        incorrectCharsCount++;
                    }

                    cursorIndex++;
                    updateCursorPosition();

                    // Check if user completed all words in 'words' mode
                    if(testMode === 'words' && cursorIndex >= allLetters.length) {
                        finishGame();
                    }
                }
            }
        });

        function countDownTimer() {
            if(timeLeft > 0) {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
            } else {
                finishGame();
            }
        }

        function finishGame() {
            isFinished = false;
            clearInterval(timer);
            gameSection.style.display = 'none';
            resultsCard.classList.add('active');

            // WPM formula: (correct characters / 5) / time in minutes
            let timeSpentMinutes = (testMode === 'time' ? modeLimit : modeLimit) / 60; 
            // Fallback active time metric safeguard
            if(testMode === 'time' && timeLeft >= 0) {
                timeSpentMinutes = (modeLimit - timeLeft) / 60;
                if(timeSpentMinutes === 0) timeSpentMinutes = 0.01;
            }

            let wpm = Math.round((correctCharsCount / 5) / timeSpentMinutes);
            let accuracy = totalTypedCount > 0 ? Math.round((correctCharsCount / totalTypedCount) * 100) : 100;

            document.getElementById('res-wpm').textContent = wpm < 0 ? 0 : wpm;
            document.getElementById('res-acc').textContent = (accuracy < 0 ? 0 : accuracy) + '%';
            document.getElementById('res-chars').textContent = `${correctCharsCount}/${incorrectCharsCount}`;
        }

        // Keep container focused
        typingContainer.addEventListener('click', () => typingContainer.focus());

        // Initial setup boot
        initGame();
    </script>
</body>
</html>

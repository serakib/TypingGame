<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeFlow Arcade // Defend the Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f12;
            --main-color: #f39c12;
            --accent-color: #e74c3c;
            --text-color: #ecf0f1;
            --sub-color: #7f8c8d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto Mono', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 1.5rem;
            overflow: hidden;
            user-select: none;
        }

        /* Top HUD */
        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo { font-size: 1.2rem; font-weight: 700; color: var(--sub-color); }
        .logo span { color: var(--main-color); }

        .hud-stats {
            display: flex;
            gap: 2rem;
            font-size: 1rem;
        }

        .hud-item span { color: var(--main-color); font-weight: 700; }

        /* Game Arena */
        .arena {
            width: 100%;
            max-width: 800px;
            flex-grow: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            margin: 1rem 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        /* Falling Enemy Words */
        .enemy-word {
            position: absolute;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: rgba(20, 22, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            transition: top 0.05s linear;
        }

        .enemy-word.targeted {
            border-color: var(--main-color);
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.4);
        }

        .enemy-word .matched {
            color: var(--main-color);
        }

        .enemy-word .unmatched {
            color: var(--text-color);
        }

        /* Input Bar */
        .input-container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        #type-input {
            width: 100%;
            background: #161b22;
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            font-size: 1.2rem;
            color: var(--text-color);
            border-radius: 8px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }

        #type-input:focus {
            border-color: var(--main-color);
        }

        /* Game Over / Start Overlay */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 15, 18, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-card {
            background: #161b22;
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-card h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--main-color); }
        .modal-card p { color: var(--sub-color); font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .btn {
            background: var(--main-color);
            color: #0d0f12;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>

    <header>
        <div class="logo">👾 <span>TypeFlow</span> // Arcade</div>
        <div class="hud-stats">
            <div class="hud-item">Score: <span id="score">0</span></div>
            <div class="hud-item">Combo: <span id="combo">1x</span></div>
            <div class="hud-item">Lives: <span id="lives">❤️❤️❤️</span></div>
        </div>
    </header>

    <div class="arena" id="arena">
        <!-- Falling words will spawn here via JS -->
    </div>

    <div class="input-container">
        <input type="text" id="type-input" placeholder="Type falling words here to destroy them..." autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <!-- Start / Game Over Modal -->
    <div id="modal-overlay">
        <div class="modal-card">
            <h1 id="modal-title">TypeFlow Arcade</h1>
            <p id="modal-desc">Type incoming words before they hit the ground! Maintain streaks for score multipliers.</p>
            <div id="final-stats" style="margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--text-color);"></div>
            <button class="btn" id="start-btn">Start Game</button>
        </div>
    </div>

    <script>
        const wordPool = [
            "cyber", "matrix", "glitch", "arcade", "kernel", "binary", "system", 
            "syntax", "packet", "firewall", "router", "script", "terminal", "buffer", 
            "runtime", "crypto", "quantum", "vector", "thread", "daemon", "proxy"
        ];

        let score = 0;
        let combo = 1;
        let lives = 3;
        let gameRunning = false;
        let activeEnemies = [];
        let targetedEnemy = null;
        let spawnInterval = null;
        let gameLoopInterval = null;
        let spawnSpeed = 2200; // Milliseconds between spawns

        const arena = document.getElementById('arena');
        const inputField = document.getElementById('type-input');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const livesEl = document.getElementById('lives');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const finalStats = document.getElementById('final-stats');
        const startBtn = document.getElementById('start-btn');

        // Web Audio Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                if (type === 'hit') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                } else if (type === 'miss') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                }
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function startGame() {
            // Reset state
            arena.innerHTML = '';
            activeEnemies = [];
            targetedEnemy = null;
            score = 0;
            combo = 1;
            lives = 3;
            spawnSpeed = 2200;
            gameRunning = true;

            modalOverlay.style.display = 'none';
            inputField.value = '';
            inputField.focus();

            updateHUD();

            // Start loops
            spawnInterval = setInterval(spawnEnemy, spawnSpeed);
            gameLoopInterval = setInterval(updateGame, 30);
        }

        function spawnEnemy() {
            if (!gameRunning) return;

            const word = wordPool[Math.floor(Math.random() * wordPool.length)];
            // Ensure word isn't already active on screen
            if (activeEnemies.some(e => e.word === word)) return;

            const el = document.createElement('div');
            el.classList.add('enemy-word');
            el.innerHTML = `<span class="unmatched">${word}</span>`;
            
            // Random horizontal position inside arena
            const maxLeft = arena.clientWidth - 120;
            const leftPos = Math.max(10, Math.floor(Math.random() * maxLeft));
            el.style.left = leftPos + 'px';
            el.style.top = '0px';

            arena.appendChild(el);

            activeEnemies.push({
                word: word,
                typedIndex: 0,
                element: el,
                top: 0,
                speed: 1.2 + (score / 500) // Gradually speeds up as score increases
            });
        }

        function updateGame() {
            if (!gameRunning) return;

            for (let i = activeEnemies.length - 1; i >= 0; i--) {
                let enemy = activeEnemies[i];
                enemy.top += enemy.speed;
                enemy.element.style.top = enemy.top + 'px';

                // Check if enemy hit the bottom of the arena
                if (enemy.top >= arena.clientHeight - 40) {
                    loseLife();
                    arena.removeChild(enemy.element);
                    activeEnemies.splice(i, 1);
                    if (targetedEnemy === enemy) targetedEnemy = null;
                }
            }
        }

        function loseLife() {
            lives--;
            combo = 1;
            playSound('miss');
            updateHUD();

            if (lives <= 0) {
                gameOver();
            }
        }

        function updateHUD() {
            scoreEl.innerText = score;
            comboEl.innerText = combo + 'x';
            livesEl.innerText = '❤️'.repeat(Math.max(0, lives));
        }

        // Handle typing input
        inputField.addEventListener('input', (e) => {
            if (!gameRunning) return;
            const typedText = inputField.value.trim();

            // If we don't have a targeted word yet, find one that matches the first letter
            if (!targetedEnemy) {
                targetedEnemy = activeEnemies.find(e => e.word.startsWith(typedText));
                if (targetedEnemy) {
                    targetedEnemy.element.classList.add('targeted');
                }
            }

            if (targetedEnemy) {
                // Check if what the user typed matches the start of the targeted word
                if (targetedEnemy.word.startsWith(typedText)) {
                    targetedEnemy.typedIndex = typedText.length;
                    
                    // Highlight matched vs unmatched letters
                    const matchedPart = targetedEnemy.word.substring(0, typedText.length);
                    const unmatchedPart = targetedEnemy.word.substring(typedText.length);
                    targetedEnemy.element.innerHTML = `<span class="matched">${matchedPart}</span><span class="unmatched">${unmatchedPart}</span>`;
                    
                    playSound('hit');

                    // Complete word check
                    if (typedText === targetedEnemy.word) {
                        score += 10 * combo;
                        combo++;
                        inputField.value = ''; // Clear input for next word
                        
                        // Remove enemy from screen
                        arena.removeChild(targetedEnemy.element);
                        activeEnemies = activeEnemies.filter(e => e !== targetedEnemy);
                        targetedEnemy = null;
                        updateHUD();
                    }
                } else {
                    // Typo on current target! Reset combo & target
                    combo = 1;
                    if (targetedEnemy) targetedEnemy.element.classList.remove('targeted');
                    targetedEnemy = null;
                    inputField.value = '';
                    playSound('miss');
                    updateHUD();
                }
            } else {
                inputField.value = ''; // Clear unmatched random typing
            }
        });

        function gameOver() {
            gameRunning = false;
            clearInterval(spawnInterval);
            clearInterval(gameLoopInterval);

            // LocalStorage High Score
            const bestScore = parseInt(localStorage.getItem('typeflow_arcade_pb')) || 0;
            let pbText = '';
            if (score > bestScore) {
                localStorage.setItem('typeflow_arcade_pb', score);
                pbText = `<span style="color:var(--main-color);">★ NEW HIGH SCORE: ${score}!</span>`;
            } else {
                pbText = `Score: ${score} | High Score: ${bestScore}`;
            }

            modalTitle.innerText = "Game Over";
            modalDesc.innerText = "The system was overrun by untyped errors.";
            finalStats.innerHTML = pbText;
            startBtn.innerText = "Play Again";
            modalOverlay.style.display = 'flex';
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
